<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Directory | DayFlow</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
  <main class="page-shell">
    <header class="page-header"><h1>Employee Directory</h1><a href="{{ url_for('pages.admin_leaves') }}">Leave requests</a></header>
    <section class="card" data-employee-directory data-employees-endpoint="/api/employees" data-employee-details-path="/employees">
      <label>Search employees<input data-employee-search type="search" placeholder="Name, department, or job title"></label>
      <p class="employee-feedback" role="status" aria-live="polite" data-employee-feedback></p>
      <div class="employee-grid" data-employee-grid></div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/admin_directory.js') }}" defer></script>
</body>
</html>
